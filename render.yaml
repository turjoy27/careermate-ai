services:
  # ==============================================================================
  # CareerMate AI - Web Service (Native Python on Render)
  # ==============================================================================
  - type: web
    name: careermate-ai
    runtime: python
    region: oregon
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn careermate_core.wsgi:application --chdir backend --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careermate-postgres
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"

databases:
  # ==============================================================================
  # CareerMate AI - Managed PostgreSQL Database
  # ==============================================================================
  - name: careermate-postgres
    region: oregon
    plan: starter
    databaseName: careermate_ai
    user: careermate_user
