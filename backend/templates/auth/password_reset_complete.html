{% extends 'base.html' %}
{% block title %}Password Reset Successful — CareerMate AI{% endblock %}

{% block public_content %}
<div class="auth-wrapper">
  <div class="auth-card text-center">
    <div class="stat-icon success mx-auto mb-3" style="width: 56px; height: 56px;">
      <i class="bi bi-shield-check fs-3 text-success"></i>
    </div>
    <h3 class="fw-bold mb-2">Password Reset Done</h3>
    <p class="text-muted small mb-4">
      Your password has been changed successfully. You may now log in with your new credentials.
    </p>
    <a href="{% url 'accounts-login' %}" class="btn btn-primary-custom w-100 py-2">
      <i class="bi bi-box-arrow-in-right me-1"></i>Sign In Now
    </a>
  </div>
</div>
{% endblock %}
