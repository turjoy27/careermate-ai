{% extends 'base.html' %}
{% block title %}Reset Password — CareerMate AI{% endblock %}

{% block public_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.3rem;">
        <i class="bi bi-key-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Reset your password</h3>
      <p class="text-muted small">Enter your account email to receive a password recovery link.</p>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_email" class="form-label small fw-semibold">Email Address</label>
        <input type="email" name="email" class="form-control" id="id_email" placeholder="name@example.com" required>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2">
        <i class="bi bi-envelope-paper me-1"></i>Send Reset Link
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <a href="{% url 'accounts-login' %}" class="small text-decoration-none text-muted">
        <i class="bi bi-arrow-left me-1"></i>Back to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
